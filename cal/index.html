<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal.com-demo · Bildfabriken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111; --text: #3c3f44; --muted: #6b7280; --line: #e5e7eb; --soft: #f3f4f6; --bg: #f9fafb;
  --brand: #000; --pend: #b45309; --pendbg: #fef3c7; --ok: #047857; --okbg: #d1fae5; --no: #b91c1c; --nobg: #fee2e2;
  --sans: "Inter", system-ui, sans-serif; --mono: "Roboto Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
h1, h2, h3 { color: var(--ink); margin: 0; line-height: 1.25; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: var(--ink); }
input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
textarea { min-height: 70px; resize: vertical; }
label.f { display: block; margin-bottom: 14px; font-weight: 500; color: var(--ink); }
label.f > span { display: block; margin-bottom: 5px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--brand);
  background: var(--brand); color: #fff; cursor: pointer; font-weight: 500; text-decoration: none; }
.btn.sec { background: #fff; color: var(--ink); border-color: #d1d5db; }
.btn.no { background: #fff; color: var(--no); border-color: #fca5a5; }
.btn:hover { opacity: .88; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--soft); color: var(--text); }
.badge.pending { background: var(--pendbg); color: var(--pend); }
.badge.accepted { background: var(--okbg); color: var(--ok); }
.badge.rejected, .badge.cancelled { background: var(--nobg); color: var(--no); }

/* demoband */
.demobar { background: #111; color: #fff; padding: 8px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; }
.demobar b { font-family: var(--mono); letter-spacing: .05em; }
.demobar nav { display: flex; gap: 6px; flex-wrap: wrap; }
.demobar a, .demobar button { color: #fff; text-decoration: none; padding: 5px 10px; border: 1px solid #444; border-radius: 4px; background: none; cursor: pointer; font-size: 13px; }
.demobar a.on { background: #fff; color: #111; }

/* kund: profil och booker */
.wrap { max-width: 1060px; margin: 0 auto; padding: 40px 16px 80px; }
.profile { text-align: center; margin-bottom: 28px; }
.profile img { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line); background: #fff; object-fit: contain; padding: 6px; }
.profile h1 { font-size: 22px; margin-top: 10px; }
.types { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.types a { display: block; padding: 18px 20px; text-decoration: none; border-bottom: 1px solid var(--line); }
.types a:last-child { border-bottom: 0; }
.types a:hover { background: var(--soft); }
.types h2 { font-size: 15px; }
.types p { margin: 2px 0 8px; color: var(--muted); }

.booker { background: #fff; border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 280px 1fr 220px; min-height: 460px; }
.booker.form { grid-template-columns: 280px 1fr; }
.b-info { padding: 22px; border-right: 1px solid var(--line); }
.b-info img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); object-fit: contain; padding: 3px; }
.b-info .who { color: var(--muted); margin: 8px 0 2px; }
.b-info h1 { font-size: 20px; margin-bottom: 14px; }
.b-info ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.b-info li { display: flex; gap: 8px; align-items: flex-start; }
.b-info li i { font-style: normal; width: 18px; text-align: center; }
.b-cal { padding: 22px; }
.b-cal .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.b-cal .head h2 { font-size: 15px; text-transform: capitalize; }
.b-cal .head button { border: 0; background: none; font-size: 18px; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; }
.b-cal .head button:hover { background: var(--soft); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.month .dow { font-size: 11px; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 4px; }
.month button { aspect-ratio: 1; border: 0; border-radius: 8px; background: transparent; color: #b3b8bf; font-weight: 500; cursor: default; }
.month button.avail { background: var(--soft); color: var(--ink); cursor: pointer; }
.month button.avail:hover { outline: 1px solid var(--ink); }
.month button.sel { background: var(--brand); color: #fff; }
.b-slots { padding: 22px 16px; border-left: 1px solid var(--line); max-height: 520px; overflow: auto; }
.b-slots h3 { font-size: 14px; margin-bottom: 12px; text-transform: capitalize; }
.b-slots button { display: block; width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-weight: 500; }
.b-slots button:hover { border-color: var(--ink); }
.b-slots .none { color: var(--muted); }
.b-form { padding: 22px; max-width: 520px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--no); min-height: 1.4em; }
.hint { margin: -8px 0 14px; color: var(--muted); font-size: 13px; }

.status { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 32px; }
.status .ico { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 14px; }
.status h1 { text-align: center; font-size: 20px; margin-bottom: 6px; }
.status > p { text-align: center; color: var(--muted); margin: 0 0 20px; }
.status dl { display: grid; grid-template-columns: 110px 1fr; gap: 10px; margin: 0; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.status dt { font-weight: 600; color: var(--ink); }
.status dd { margin: 0; }
.status .acts { text-align: center; margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* fotograf: admin */
.admin { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 44px); }
.side { background: #fff; border-right: 1px solid var(--line); padding: 18px 12px; }
.side .me { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; font-weight: 600; color: var(--ink); }
.side .me img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); object-fit: contain; padding: 2px; }
.side a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--text); margin-bottom: 2px; }
.side a.on, .side a:hover { background: var(--soft); color: var(--ink); font-weight: 500; }
.side .n { background: var(--ink); color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; }
.main { padding: 28px 32px 80px; max-width: 980px; }
.main > h1 { font-size: 20px; }
.main > p.sub { color: var(--muted); margin: 4px 0 18px; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 8px 12px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--ink); border-color: var(--ink); font-weight: 500; }
.list { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.bk { display: grid; grid-template-columns: 150px 1fr auto; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); align-items: start; }
.bk:last-child { border-bottom: 0; }
.bk .when b { display: block; color: var(--ink); }
.bk .when span { color: var(--muted); display: block; margin-bottom: 6px; }
.bk h3 { font-size: 14px; font-weight: 600; }
.bk p { margin: 2px 0 0; color: var(--muted); }
.bk .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.bk .reason { grid-column: 2 / 4; display: flex; gap: 8px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.tip { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }

.sched { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 18px; }
.sched .d { display: grid; grid-template-columns: 44px 90px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sched .d:last-child { border-bottom: 0; }
.sched .times { display: flex; gap: 8px; align-items: center; }
.sched .times input { width: 110px; }
.sched .off { color: var(--muted); }
.switch { position: relative; width: 36px; height: 20px; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: #d1d5db; border-radius: 10px; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; top: 2px; left: 2px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--ink); }
.switch input:checked + span::after { left: 18px; }
.overrides { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 20px; }
.overrides .add { display: flex; gap: 8px; max-width: 420px; margin: 10px 0; }
.overrides ul { list-style: none; padding: 0; margin: 0; }
.overrides li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }

.mail { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
.mail .hd { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
.mail h3 { font-size: 15px; margin: 4px 0 8px; }
.mail pre { white-space: pre-wrap; font: inherit; margin: 0 0 10px; }

/* mobil-pling */
#phone { position: fixed; right: 20px; bottom: 20px; width: 300px; height: 600px; background: #111; border-radius: 40px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); z-index: 20; animation: in .35s ease-out; }
@keyframes in { from { transform: translateY(40px); opacity: 0; } }
#phone .scr { height: 100%; border-radius: 30px; background: linear-gradient(160deg, #3b4252, #1f2430); padding: 46px 12px 12px; color: #fff; position: relative; overflow: hidden; }
#phone .clock { text-align: center; font-size: 54px; font-weight: 300; line-height: 1; }
#phone .date { text-align: center; opacity: .8; margin-bottom: 26px; }
#phone .note { background: rgba(255,255,255,.88); color: #111; border-radius: 16px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
#phone .note .app { display: flex; justify-content: space-between; font-size: 11px; color: #555; margin-bottom: 4px; }
#phone .note .app b { color: #111; }
#phone .note p { margin: 2px 0 10px; }
#phone .note .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#phone .note .acts button { padding: 8px; border-radius: 10px; border: 0; background: #e5e7eb; font-weight: 600; cursor: pointer; }
#phone .note .acts .ja { background: #111; color: #fff; }
#phone .x { position: absolute; top: 14px; right: 16px; background: none; border: 0; color: #fff; font-size: 18px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 24px; translate: -50%; background: #111; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 30; }

@media (max-width: 900px) {
  .booker, .booker.form { grid-template-columns: 1fr; }
  .b-info { border-right: 0; border-bottom: 1px solid var(--line); }
  .b-slots { border-left: 0; border-top: 1px solid var(--line); }
  .admin { grid-template-columns: 1fr; }
  .side { display: flex; gap: 4px; overflow-x: auto; padding: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .me { display: none; }
  .main { padding: 20px 16px 80px; }
  .bk { grid-template-columns: 1fr; }
  .bk .acts { justify-content: flex-start; }
  .bk .reason { grid-column: 1; }
  .row { grid-template-columns: 1fr; }
  #phone { transform: scale(.8); transform-origin: bottom right; right: 10px; bottom: 10px; }
}
</style>
</head>
<body>

<div class="demobar">
  <span><b>CAL.COM-DEMO</b> · Flödet som Cal.com gör det, med Bildfabs inställningar. Återskapat för att kunna klicka runt utan konto.</span>
  <nav>
    <a href="#/" id="d-kund">Kundvy</a>
    <a href="#/admin/obekraftade" id="d-foto">Fotografvy</a>
    <a href="../index.html">← Alla alternativ</a>
    <button type="button" data-act="aterstall">Återställ demo</button>
  </nav>
</div>
<div id="app"></div>
<div id="phone" hidden></div>

<script src="../restid.js"></script>
<script>
const TYPER = [
  { id: "lagenhet", namn: "Bostadsfoto lägenhet", min: 90, info: "Upp till 25 bilder. Leverans nästa vardag." },
  { id: "villa", namn: "Bostadsfoto villa / radhus", min: 150, info: "Interiör och exteriör, 30–40 bilder." },
  { id: "villa-dronare", namn: "Villa + drönare", min: 180, info: "Som villa, plus 5–8 drönarbilder." },
  { id: "arkitektur", namn: "Arkitektur / kommersiellt", min: 240, info: "Halvdag. Pris enligt offert." },
];
const BUFFERT = 30;       // restid mellan uppdrag, minuter
const VARSEL_H = 24;      // minsta varsel för en bokning
const STEG = 30;          // starttider var 30:e minut
const FOTOGRAF = "info@bildfab.se";
const KEY = "bildfab-cal-demo";

// ---------- hjälpare ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const minuter = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const langt = s => fromIso(s).toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" });
const kort = s => fromIso(s).toLocaleDateString("sv-SE", { weekday: "short", day: "numeric", month: "short" });
const langd = m => m % 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m / 60} h`;
const typ = id => TYPER.find(t => t.id === id);
const tidsspann = b => `${hhmm(b.start)}–${hhmm(b.start + typ(b.typ).min)}`;
const VECKODAGAR = ["sön", "mån", "tis", "ons", "tor", "fre", "lör"];

function vardag(n) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let k = 0; k < n;) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) k++; }
  return iso(d);
}

// ---------- data ----------
function standard() {
  const dag = (pa, fran, till) => ({ pa, fran, till });
  return {
    schema: { 1: dag(true, "08:00", "16:00"), 2: dag(true, "08:00", "16:00"), 3: dag(true, "08:00", "16:00"),
      4: dag(true, "08:00", "16:00"), 5: dag(true, "08:00", "14:00"), 6: dag(false, "10:00", "14:00"), 0: dag(false, "10:00", "14:00") },
    blockerade: [],
    bokningar: [
      { id: "b1", typ: "villa", datum: vardag(2), start: 540, status: "accepted", namn: "Erik Demo", epost: "erik@demomaklarna.se",
        telefon: "070-000 00 01", firma: "Demomäklarna", adress: "Björkvägen 4, Umeå", tilltrade: "Säljaren är hemma", ovrigt: "", skapad: Date.now() - 864e5 },
      { id: "b2", typ: "lagenhet", datum: vardag(3), start: 600, status: "pending", namn: "Anna Exempel", epost: "anna@exempelmaklare.se",
        telefon: "070-000 00 02", firma: "Exempel Mäklare", adress: "Storgatan 22 B, Umeå", tilltrade: "Nyckel hos mäklaren", ovrigt: "Visning på söndag, behöver bilder fredag.", skapad: Date.now() - 36e5 },
    ],
    mejl: [],
  };
}
let S = ladda();
function ladda() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.bokningar) return s; } catch {}
  const s = standard();
  s.mejl.push(mejlForfragan(s.bokningar[1]));
  return s;
}
function spara() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

// Lediga starttider för en typ ett visst datum. Obekräftade (prel) bokningar blockerar precis som bekräftade.
function lediga(typId, datum) {
  const d = fromIso(datum), dag = S.schema[d.getDay()];
  if (!dag.pa || S.blockerade.includes(datum)) return [];
  const len = typ(typId).min, grans = Date.now() + VARSEL_H * 36e5;
  const upptagna = S.bokningar.filter(b => b.datum === datum && (b.status === "pending" || b.status === "accepted"));
  const ut = [];
  for (let t = minuter(dag.fran); t + len <= minuter(dag.till); t += STEG) {
    const start = new Date(d); start.setMinutes(t);
    if (start < grans) continue;
    if (upptagna.some(b => t < b.start + typ(b.typ).min + BUFFERT && b.start < t + len + BUFFERT)) continue;
    ut.push(t);
  }
  return ut;
}

// ---------- mejl och åtgärder ----------
function mejl(till, amne, text, bokning, knappar = []) {
  return { id: "m" + Date.now() + Math.random().toString(36).slice(2, 6), till, amne, text, bokning, knappar, tid: Date.now() };
}
function detaljer(b) {
  return `${typ(b.typ).namn}\n${langt(b.datum)}, ${tidsspann(b)}\nAdress: ${b.adress}\n` +
    (b.restid ? `Restid: ${restidText(b.restid)}
` : "") +
    `Kontakt: ${b.namn}${b.firma ? ", " + b.firma : ""}, ${b.epost}, ${b.telefon}` +
    (b.tilltrade ? `\nTillträde: ${b.tilltrade}` : "") + (b.ovrigt ? `\nÖvrigt: ${b.ovrigt}` : "");
}
function mejlForfragan(b) {
  return mejl(FOTOGRAF, `Ny bokningsförfrågan: ${typ(b.typ).namn}, ${kort(b.datum)} ${hhmm(b.start)}`,
    `${b.namn} vill boka:\n\n${detaljer(b)}\n\nTiden är preliminärt reserverad tills du svarar.`, b.id, ["godkann", "avboj"]);
}
const hitta = id => S.bokningar.find(b => b.id === id);

function skapa(b) {
  S.bokningar.push(b);
  S.mejl.push(mejlForfragan(b));
  spara();
  visaTelefon(b);
}
function godkann(id) {
  const b = hitta(id); if (!b || b.status !== "pending") return;
  b.status = "accepted";
  S.mejl.push(mejl(b.epost, `Bekräftad: ${typ(b.typ).namn}, ${kort(b.datum)} ${hhmm(b.start)}`,
    `Hej ${b.namn.split(" ")[0]}!\n\nDin bokning är bekräftad.\n\n${detaljer(b)}\n\nBehöver du avboka eller boka om? Använd länken nedan.\n\nVänliga hälsningar\nBildfabriken`, b.id, ["hantera"]));
  spara(); toast("Bokningen är bekräftad. Kunden har fått mejl.");
}
function avboj(id, orsak) {
  const b = hitta(id); if (!b || b.status !== "pending") return;
  b.status = "rejected"; b.orsak = orsak;
  S.mejl.push(mejl(b.epost, `Kunde inte bekräftas: ${typ(b.typ).namn}, ${kort(b.datum)}`,
    `Hej ${b.namn.split(" ")[0]}!\n\nTyvärr kan vi inte ta den här tiden.${orsak ? "\nOrsak: " + orsak : ""}\n\nVälj gärna en annan tid på bokningssidan.\n\nVänliga hälsningar\nBildfabriken`, b.id, ["boka"]));
  spara(); toast("Avböjd. Tiden är ledig igen och kunden har fått mejl.");
}
function avboka(id, av, orsak) {
  const b = hitta(id); if (!b || !["pending", "accepted"].includes(b.status)) return;
  b.status = "cancelled"; b.orsak = orsak; b.avbokadAv = av;
  const till = av === "kund" ? FOTOGRAF : b.epost;
  S.mejl.push(mejl(till, `Avbokad: ${typ(b.typ).namn}, ${kort(b.datum)} ${hhmm(b.start)}`,
    `Bokningen har avbokats av ${av === "kund" ? b.namn : "Bildfabriken"}.${orsak ? "\nOrsak: " + orsak : ""}\n\n${detaljer(b)}`, b.id));
  spara(); toast("Avbokad. Tiden är ledig igen.");
}

// ---------- vy-tillstånd ----------
const V = { manad: null, datum: null, tid: null, avbojer: null, avbokar: false, mejlflik: "foto", restid: null };

function toast(t) {
  const el = Object.assign(document.createElement("div"), { className: "toast", textContent: t });
  document.body.append(el); setTimeout(() => el.remove(), 2800);
}

function visaTelefon(b) {
  const nu = new Date();
  $("#phone").innerHTML = `<div class="scr">
    <button class="x" data-act="stangtelefon" aria-label="Stäng">×</button>
    <div class="clock">${pad(nu.getHours())}:${pad(nu.getMinutes())}</div>
    <div class="date">${nu.toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" })}</div>
    <div class="note">
      <div class="app"><b>Cal.com</b><span>nu</span></div>
      <b>Ny bokningsförfrågan</b>
      <p>${esc(b.namn)}${b.firma ? " (" + esc(b.firma) + ")" : ""}<br>${esc(typ(b.typ).namn)}<br>${esc(kort(b.datum))} ${tidsspann(b)} · ${esc(b.adress)}${b.restid ? `<br>🚗 ${b.restid.min} min från kontoret` : ""}</p>
      <div class="acts" style="grid-template-columns:1fr"><a class="ja" href="#/admin/obekraftade" data-act="stangtelefon" style="text-align:center;padding:8px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:600">Öppna i Cal-appen</a></div>
    </div>
    <div class="note">
      <div class="app"><b>Mejl</b><span>nu</span></div>
      <b>Ny bokningsförfrågan: ${esc(typ(b.typ).namn)}</b>
      <p>Till ${FOTOGRAF}. Knapparna finns i mejlet:</p>
      <div class="acts"><button class="ja" data-act="godkann" data-id="${b.id}">Godkänn</button><button data-act="avboj-start" data-id="${b.id}">Avböj</button></div>
    </div>
  </div>`;
  $("#phone").hidden = false;
}

// ---------- kundvyer ----------
const logga = `<img src="../mvp/assets/Bildfabriken-logo.png" alt="">`;

function vyProfil() {
  return `<div class="wrap">
    <div class="profile">${logga}<h1>Bildfabriken</h1><p style="color:var(--muted)">Fotografering av bostäder och arkitektur i Umeå med omnejd.<br>Alla bokningar bekräftas av fotografen.</p></div>
    <div class="types">${TYPER.map(t => `<a href="#/t/${t.id}">
      <h2>${esc(t.namn)}</h2><p>${esc(t.info)}</p>
      <span class="badge">⏱ ${langd(t.min)}</span> <span class="badge pending">Kräver bekräftelse</span></a>`).join("")}</div>
  </div>`;
}

function infoKolumn(t, extra = "") {
  return `<div class="b-info">${logga}<div class="who">Bildfabriken</div><h1>${esc(t.namn)}</h1>
    <ul><li><i>⏱</i>${langd(t.min)}</li><li><i>📍</i>På objektets adress</li><li><i>✓</i>Kräver bekräftelse av fotografen</li>${extra}</ul>
    <p style="color:var(--muted);margin-top:14px">${esc(t.info)}</p></div>`;
}

function forstaLedigaDag(typId, manad) {
  const dagar = new Date(manad.getFullYear(), manad.getMonth() + 1, 0).getDate();
  for (let i = 1; i <= dagar; i++) { const s = iso(new Date(manad.getFullYear(), manad.getMonth(), i)); if (lediga(typId, s).length) return s; }
  return null;
}

function vyBooker(t) {
  if (!V.manad) {
    // första besöket: hoppa fram till första månaden med lediga tider (max tre månader)
    V.manad = new Date(); V.manad.setDate(1); V.manad.setHours(0, 0, 0, 0);
    for (let i = 0; i < 3 && !forstaLedigaDag(t.id, V.manad); i++) V.manad.setMonth(V.manad.getMonth() + 1);
  }
  const ar = V.manad.getFullYear(), man = V.manad.getMonth();
  const dagar = new Date(ar, man + 1, 0).getDate(), forsta = (V.manad.getDay() + 6) % 7;
  const tillg = {};
  for (let i = 1; i <= dagar; i++) { const s = iso(new Date(ar, man, i)); tillg[s] = lediga(t.id, s).length > 0; }
  if (!V.datum || !(V.datum in tillg) || !tillg[V.datum]) V.datum = Object.keys(tillg).find(k => tillg[k]) || null;
  let celler = ["mån", "tis", "ons", "tor", "fre", "lör", "sön"].map(d => `<span class="dow">${d}</span>`).join("") + "<span></span>".repeat(forsta);
  for (let i = 1; i <= dagar; i++) {
    const s = iso(new Date(ar, man, i));
    celler += `<button type="button" class="${tillg[s] ? "avail" : ""}${s === V.datum ? " sel" : ""}" ${tillg[s] ? `data-act="valjdag" data-d="${s}"` : "disabled"}>${i}</button>`;
  }
  const tider = V.datum ? lediga(t.id, V.datum) : [];
  return `<div class="wrap"><div class="booker">
    ${infoKolumn(t)}
    <div class="b-cal">
      <div class="head"><h2>${V.manad.toLocaleDateString("sv-SE", { month: "long", year: "numeric" })}</h2>
        <div><button type="button" data-act="manad" data-d="-1" aria-label="Föregående månad">‹</button><button type="button" data-act="manad" data-d="1" aria-label="Nästa månad">›</button></div></div>
      <div class="month">${celler}</div>
    </div>
    <div class="b-slots">
      ${V.datum ? `<h3>${esc(kort(V.datum))}</h3>${tider.map(m => `<button type="button" data-act="valjtid" data-t="${m}">${hhmm(m)}</button>`).join("")}`
        : `<p class="none">Inga lediga tider den här månaden. Bläddra framåt.</p>`}
    </div>
  </div></div>`;
}

function vyFormular(t) {
  if (V.tid == null || !V.datum) { location.hash = "#/t/" + t.id; return ""; }
  return `<div class="wrap"><div class="booker form">
    ${infoKolumn(t, `<li><i>📅</i><b>${esc(langt(V.datum))}<br>${hhmm(V.tid)}–${hhmm(V.tid + t.min)}</b></li>`)}
    <form class="b-form" id="bokform" novalidate>
      <div class="row">
        <label class="f"><span>Ditt namn *</span><input name="namn" required autocomplete="name"></label>
        <label class="f"><span>Mäklarfirma</span><input name="firma" autocomplete="organization"></label>
      </div>
      <div class="row">
        <label class="f"><span>E-post *</span><input name="epost" type="email" required autocomplete="email"></label>
        <label class="f"><span>Mobil *</span><input name="telefon" type="tel" required autocomplete="tel"></label>
      </div>
      <label class="f"><span>Objektets adress *</span><input name="adress" id="adress" required placeholder="Gata och nummer, ort"></label>
      <p class="hint" id="restid" aria-live="polite"></p>
      <label class="f"><span>Tillträde</span><input name="tilltrade" placeholder="Säljaren hemma, nyckel hos mäklaren, portkod ..."></label>
      <label class="f"><span>Övrigt</span><textarea name="ovrigt" placeholder="Visningsdatum, saker att tänka på ..."></textarea></label>
      <p class="err" id="err" role="alert"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <a class="btn sec" href="#/t/${t.id}">Tillbaka</a>
        <button class="btn" type="submit">Skicka bokningsförfrågan</button>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:14px">Tiden reserveras preliminärt. Du får ett mejl när fotografen har bekräftat.</p>
    </form>
  </div></div>`;
}

function vyStatus(b) {
  if (!b) return `<div class="wrap"><div class="status"><h1>Bokningen finns inte</h1></div></div>`;
  const t = typ(b.typ);
  const st = {
    pending: ["⏳", "var(--pendbg)", "Förfrågan skickad", "Tiden är preliminärt reserverad åt dig. Du får ett mejl när fotografen har bekräftat."],
    accepted: ["✓", "var(--okbg)", "Bokningen är bekräftad", "En bekräftelse har skickats till " + esc(b.epost) + "."],
    rejected: ["×", "var(--nobg)", "Bokningen kunde inte bekräftas", b.orsak ? "Orsak: " + esc(b.orsak) : "Välj gärna en annan tid."],
    cancelled: ["×", "var(--nobg)", "Bokningen är avbokad", b.orsak ? "Orsak: " + esc(b.orsak) : ""],
  }[b.status];
  const kanAvboka = b.status === "pending" || b.status === "accepted";
  return `<div class="wrap"><div class="status">
    <div class="ico" style="background:${st[1]}">${st[0]}</div>
    <h1>${st[2]}</h1><p>${st[3]}</p>
    <dl>
      <dt>Vad</dt><dd>${esc(t.namn)}</dd>
      <dt>När</dt><dd>${esc(langt(b.datum))}<br>${tidsspann(b)}</dd>
      <dt>Var</dt><dd>${esc(b.adress)}</dd>
      <dt>Vem</dt><dd>${esc(b.namn)}${b.firma ? ", " + esc(b.firma) : ""}<br>${esc(b.epost)}</dd>
      <dt>Status</dt><dd><span class="badge ${b.status}">${STATUS[b.status]}</span></dd>
    </dl>
    ${kanAvboka && V.avbokar ? `<form id="avbokform" style="margin-top:16px">
      <label class="f"><span>Orsak till avbokning (valfritt)</span><textarea name="orsak"></textarea></label>
      <div style="display:flex;gap:8px;justify-content:center"><button type="button" class="btn sec" data-act="avboka-avbryt">Behåll bokningen</button><button class="btn no" type="submit">Avboka</button></div>
    </form>` : `<div class="acts">
      ${kanAvboka ? `<button class="btn sec" data-act="avboka-start">Avboka</button>` : ""}
      <a class="btn" href="#/t/${b.typ}">Boka ${kanAvboka ? "en till" : "en ny"} tid</a>
    </div>`}
  </div></div>`;
}

// ---------- fotografvyer ----------
const STATUS = { pending: "Obekräftad", accepted: "Bekräftad", rejected: "Avböjd", cancelled: "Avbokad" };

function admin(aktiv, innehall) {
  const obek = S.bokningar.filter(b => b.status === "pending").length;
  const länk = (h, txt, n) => `<a href="#/admin/${h}" class="${aktiv === h ? "on" : ""}">${txt}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  return `<div class="admin">
    <aside class="side">
      <div class="me">${logga}Bildfabriken</div>
      ${länk("obekraftade", "Obekräftade", obek)}
      ${länk("kommande", "Kommande")}
      ${länk("avbokade", "Avbokade / avböjda")}
      ${länk("tillganglighet", "Tillgänglighet")}
      ${länk("inkorg", "Inkorg (demo)")}
      <a href="#/">Öppna bokningssidan ↗</a>
    </aside>
    <section class="main">${innehall}</section>
  </div>`;
}

function vyBokningar(flik) {
  const nu = iso(new Date());
  const urval = {
    obekraftade: b => b.status === "pending",
    kommande: b => b.status === "accepted" && b.datum >= nu,
    avbokade: b => b.status === "rejected" || b.status === "cancelled",
  }[flik];
  const lista = S.bokningar.filter(urval).sort((a, b) => (a.datum + pad(a.start)).localeCompare(b.datum + pad(b.start)));
  const rad = b => `<div class="bk">
    <div class="when"><b>${esc(kort(b.datum))}</b><span>${tidsspann(b)}</span><span class="badge ${b.status}">${STATUS[b.status]}</span></div>
    <div><h3>${esc(typ(b.typ).namn)} mellan Bildfabriken och ${esc(b.namn)}</h3>
      <p>📍 ${esc(b.adress)}${b.firma ? " · " + esc(b.firma) : ""}</p>
      ${b.restid ? `<p>🚗 ${esc(restidText(b.restid))}</p>` : ""}
      <p>${esc(b.epost)} · ${esc(b.telefon)}</p>
      ${b.tilltrade ? `<p>Tillträde: ${esc(b.tilltrade)}</p>` : ""}${b.ovrigt ? `<p>"${esc(b.ovrigt)}"</p>` : ""}
      ${b.orsak ? `<p>Orsak: ${esc(b.orsak)}</p>` : ""}</div>
    <div class="acts">
      ${b.status === "pending" ? `<button class="btn no" data-act="avboj-start" data-id="${b.id}">Avböj</button><button class="btn" data-act="godkann" data-id="${b.id}">Godkänn</button>` : ""}
      ${b.status === "accepted" ? `<button class="btn sec" data-act="fotoavboka" data-id="${b.id}">Avboka</button>` : ""}
    </div>
    ${V.avbojer === b.id ? `<form class="reason" data-avboj="${b.id}"><input name="orsak" placeholder="Orsak (skickas till kunden), t.ex. Fullt den dagen, går det på torsdag?" autofocus><button class="btn no" type="submit">Avböj</button></form>` : ""}
  </div>`;
  const rubrik = { obekraftade: "Obekräftade", kommande: "Kommande", avbokade: "Avbokade och avböjda" }[flik];
  return admin(flik, `<h1>Bokningar</h1><p class="sub">${rubrik}</p>
    ${flik === "obekraftade" ? `<div class="tip"><b>Kräver bekräftelse: alltid.</b> Obekräftade bokningar håller tiden preliminärt, ingen annan kan boka den. Du får mejl med Godkänn/Avböj-knappar och en notis i Cal-appen.</div>` : ""}
    <div class="list">${lista.length ? lista.map(rad).join("") : `<div class="empty">Inga bokningar här.</div>`}</div>`);
}

function vyTillganglighet() {
  const ordning = [1, 2, 3, 4, 5, 6, 0];
  return admin("tillganglighet", `<h1>Tillgänglighet</h1><p class="sub">Arbetstider · Europe/Stockholm</p>
    <div class="tip">I riktiga Cal.com kopplas fotografernas Google-kalendrar in. Allt som redan står där (privata tider, andra jobb) blockerar automatiskt.</div>
    <div class="sched">${ordning.map(d => {
      const s = S.schema[d];
      return `<div class="d">
        <label class="switch"><input type="checkbox" data-sched="${d}" data-k="pa" ${s.pa ? "checked" : ""} aria-label="${VECKODAGAR[d]}dag"><span></span></label>
        <b style="text-transform:capitalize">${VECKODAGAR[d]}dag</b>
        ${s.pa ? `<div class="times"><input type="time" step="1800" value="${s.fran}" data-sched="${d}" data-k="fran"> – <input type="time" step="1800" value="${s.till}" data-sched="${d}" data-k="till"></div>` : `<span class="off">Otillgänglig</span>`}
      </div>`;
    }).join("")}</div>
    <div class="overrides">
      <h3 style="font-size:15px">Datumundantag</h3>
      <p style="color:var(--muted);margin:4px 0 0">Semester, sjukdom eller fullbokat: markera dagen som otillgänglig.</p>
      <form class="add" id="blockform"><input type="date" name="d" min="${iso(new Date())}" required><button class="btn" type="submit">Lägg till</button></form>
      <ul>${S.blockerade.sort().map(d => `<li><span>${esc(langt(d))} · otillgänglig hela dagen</span><button class="btn sec" data-act="avblockera" data-d="${d}">Ta bort</button></li>`).join("") || `<li style="color:var(--muted)">Inga undantag.</li>`}</ul>
    </div>`);
}

function vyInkorg() {
  const foto = V.mejlflik === "foto";
  const lista = S.mejl.filter(m => (m.till === FOTOGRAF) === foto).sort((a, b) => b.tid - a.tid);
  const knapp = (k, m) => {
    const b = hitta(m.bokning);
    if (k === "godkann" && b?.status === "pending") return `<button class="btn" data-act="godkann" data-id="${b.id}">Godkänn</button>`;
    if (k === "avboj" && b?.status === "pending") return `<button class="btn no" data-act="avboj-start" data-id="${b.id}" data-go="1">Avböj</button>`;
    if (k === "hantera") return `<a class="btn sec" href="#/b/${m.bokning}">Hantera bokning</a>`;
    if (k === "boka") return `<a class="btn sec" href="#/t/${b?.typ || ""}">Boka en annan tid</a>`;
    return "";
  };
  return admin("inkorg", `<h1>Inkorg (demo)</h1><p class="sub">De mejl som Cal.com skickar i flödet. I verkligheten landar de i respektive persons vanliga mejl.</p>
    <div class="tabs"><a href="#" data-act="mejlflik" data-f="foto" class="${foto ? "on" : ""}">Fotografen (${FOTOGRAF})</a><a href="#" data-act="mejlflik" data-f="kund" class="${foto ? "" : "on"}">Kunderna</a></div>
    ${lista.map(m => `<div class="mail"><div class="hd"><span>Från: Cal.com · Till: ${esc(m.till)}</span><span>${new Date(m.tid).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" })}</span></div>
      <h3>${esc(m.amne)}</h3><pre>${esc(m.text)}</pre><div style="display:flex;gap:8px">${m.knappar.map(k => knapp(k, m)).join("")}</div></div>`).join("") || `<div class="list"><div class="empty">Inga mejl ännu.</div></div>`}`);
}

// ---------- routing ----------
function render() {
  const h = location.hash.slice(1) || "/";
  const [, a, b, c] = h.split("/");
  let html;
  if (a === "t" && typ(b)) html = c === "form" ? vyFormular(typ(b)) : vyBooker(typ(b));
  else if (a === "b") html = vyStatus(hitta(b));
  else if (a === "admin") html = b === "tillganglighet" ? vyTillganglighet() : b === "inkorg" ? vyInkorg()
    : vyBokningar(["obekraftade", "kommande", "avbokade"].includes(b) ? b : "obekraftade");
  else html = vyProfil();
  $("#app").innerHTML = html;
  $("#d-kund").classList.toggle("on", a !== "admin");
  $("#d-foto").classList.toggle("on", a === "admin");
  document.querySelector("[autofocus]")?.focus();
  if ($("#adress")) { V.restid = null; kopplaRestid($("#adress"), $("#restid"), r => V.restid = r, ". (Demotillägg: kräver en liten egen tjänst kopplad via Cal-webhook.)"); }
}
addEventListener("hashchange", () => {
  V.avbokar = false; V.avbojer = null;
  if (!location.hash.startsWith("#/t/")) { V.manad = null; V.datum = null; }
  render(); scrollTo(0, 0);
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { act, id } = el.dataset;
  if (act === "valjdag") V.datum = el.dataset.d;
  else if (act === "manad") { V.manad.setMonth(V.manad.getMonth() + Number(el.dataset.d)); V.datum = null; }
  else if (act === "valjtid") { V.tid = Number(el.dataset.t); location.hash = location.hash.replace(/\/form$/, "") + "/form"; return; }
  else if (act === "godkann") { godkann(id); $("#phone").hidden = true; }
  else if (act === "avboj-start") {
    $("#phone").hidden = true; V.avbojer = id;
    if (!location.hash.startsWith("#/admin/obekraftade")) { location.hash = "#/admin/obekraftade"; V.avbojer = id; setTimeout(() => { V.avbojer = id; render(); }); return; }
  }
  else if (act === "fotoavboka") avboka(id, "foto", "");
  else if (act === "avblockera") { S.blockerade = S.blockerade.filter(d => d !== el.dataset.d); spara(); }
  else if (act === "avboka-start") V.avbokar = true;
  else if (act === "avboka-avbryt") V.avbokar = false;
  else if (act === "mejlflik") { e.preventDefault(); V.mejlflik = el.dataset.f; }
  else if (act === "stangtelefon") { $("#phone").hidden = true; return; }
  else if (act === "aterstall") { try { localStorage.removeItem(KEY); } catch {} S = ladda(); $("#phone").hidden = true; toast("Demodata återställd."); }
  render();
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  if (f.id === "bokform") {
    const v = Object.fromEntries([...fd].map(([k, x]) => [k, String(x).trim()]));
    if (!v.namn || !v.telefon || !v.adress) return $("#err").textContent = "Fyll i namn, mobil och objektets adress.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.epost)) return $("#err").textContent = "Kontrollera e-postadressen.";
    const typId = location.hash.split("/")[2];
    if (!lediga(typId, V.datum).includes(V.tid)) { $("#err").textContent = "Tiden hann bli upptagen. Välj en annan."; return; }
    const b = { id: "b" + Date.now(), typ: typId, datum: V.datum, start: V.tid, status: "pending", skapad: Date.now(), ...v, restid: V.restid };
    skapa(b); V.tid = null;
    location.hash = "#/b/" + b.id;
  } else if (f.dataset.avboj) {
    avboj(f.dataset.avboj, String(fd.get("orsak")).trim()); V.avbojer = null; render();
  } else if (f.id === "avbokform") {
    avboka(location.hash.split("/")[2], "kund", String(fd.get("orsak")).trim()); V.avbokar = false; render();
  } else if (f.id === "blockform") {
    const d = fd.get("d"); if (d && !S.blockerade.includes(d)) S.blockerade.push(d); spara(); render();
  }
});

document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset.sched) return;
  const dag = S.schema[el.dataset.sched];
  if (el.dataset.k === "pa") dag.pa = el.checked;
  else if (el.value) dag[el.dataset.k] = el.value;
  if (minuter(dag.till) <= minuter(dag.fran)) { toast("Sluttiden måste vara efter starttiden."); dag.till = hhmm(minuter(dag.fran) + 60); }
  spara(); render(); toast("Sparat.");
});

render();
</script>
</body>
</html>
